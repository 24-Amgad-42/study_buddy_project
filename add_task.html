<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المهام الدراسي - إضافة مهمة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">منظم المهام الدراسي</div>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="tasks.html">المهام</a></li>
                <li><a href="add_task.html">إضافة مهمة</a></li>
                <li><a href="about.html">حول</a></li>
            </ul>
            <button id="theme-toggle" class="theme-toggle">تبديل الوضع</button>
        </nav>
    </header>

    <main>
        <section class="card">
            <h1>إضافة مهمة دراسية جديدة</h1>
            <form id="add-task-form">
                <div class="form-group">
                    <label for="task-title">عنوان المهمة:</label>
                    <input type="text" id="task-title" required placeholder="مثلاً: مذاكرة مادة الويب">
                </div>
                <div class="form-group">
                    <label for="task-desc">الوصف:</label>
                    <textarea id="task-desc" rows="4" placeholder="تفاصيل المهمة..."></textarea>
                </div>
                <div class="form-group">
                    <label for="task-date">تاريخ التسليم:</label>
                    <input type="date" id="task-date" required>
                </div>
                <button type="submit" class="btn">حفظ المهمة</button>
            </form>
        </section>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - مشروع تطوير الويب 1</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
